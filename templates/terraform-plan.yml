parameters:
- name: workingDir
  type: string

steps:

- task: TerraformTaskV4@4
  displayName: Terraform Plan

  inputs:
    provider: 'azurerm'
    command: 'plan'

    workingDirectory: ${{ parameters.workingDir }}

    environmentServiceNameAzureRM: 'Service-connection-007'

    commandOptions: '-out=tfplan'
