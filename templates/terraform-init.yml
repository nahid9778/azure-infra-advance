parameters:
- name: workingDir
  type: string

steps:

- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'

- task: TerraformTaskV4@4
  displayName: Terraform Init

  inputs:
    provider: 'azurerm'
    command: 'init'

    workingDirectory: ${{ parameters.workingDir }}

    backendServiceArm: 'Service-connection-007'

    backendAzureRmResourceGroupName: 'rg007'

    backendAzureRmStorageAccountName: 'storagebackend007'

    backendAzureRmContainerName: 'tfstate'

    backendAzureRmKey: 'dev.tfstate'
