trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

# Terraform Init
- template: templates/terraform-init.yml
  parameters:
    workingDir: 'environment/dev'

# Terraform Validate
- template: templates/terraform-validate.yml
  parameters:
    workingDir: 'environment/dev'

# tfsec Scan
- template: templates/tfsec-scan.yml
  parameters:
    workingDir: 'environment/dev'

# Terraform Plan
- template: templates/terraform-plan.yml
  parameters:
    workingDir: 'environment/dev'

# Terraform Apply
- template: templates/terraform-apply.yml
  parameters:
    workingDir: 'environment/dev'